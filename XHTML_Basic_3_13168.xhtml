<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
<!-- Deklarasi XHTML, dengan dasar aturannya adalah HTML yang mengikuti aturan XML -->
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>My Link</title>
</head>
<!-- Bagian kepala halaman. Informasi dapat dilihat pada jendela halaman website, dimana
judul halaman akan ditampilkan -->
<body>
    <a href="https://www.uajy.ac.id/">Website UAJY</a>
</body>
<!-- Bagian tubuh halaman, dimana informasi berupa link website. Dan href berisi letak link mengarah -->
</html>
