<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"

<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Tugas 4 CSS Basic - UAJY</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
    <style type="text/css">
        body {
            background-color: rgb(240, 244, 248);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: white;
            border: 1px solid rgb(200, 200, 200);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h2 {
            color: rgb(0, 90, 150);
            text-align: center;
            border-bottom: 2px solid rgb(0, 90, 150);
            padding-bottom: 10px;
        }
    </style>
</head>
<body>

    <h1 style="color: rgb(30, 100, 50); text-align: center; font-family: 'Times New Roman', Times, serif;">

    </h1>

    <div class="container">
        <h2>Profil Singkat</h2>
        <p style="font-size: 16px; line-height: 1.5; color: rgb(50, 50, 50);">
            Universitas Atma Jaya Yogyakarta (UAJY) adalah perguruan tinggi swasta yang unggul, inklusif, dan berwawasan global di Yogyakarta.
        </p>
    </div>

    <div class="menu-box">
        <h3>Navigasi Utama</h3>
        <ul>
            <li><a href="https://www.uajy.ac.id/" class="nav-link">Website Resmi UAJY</a></li>
        </ul>
